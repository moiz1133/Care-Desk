[project]
name = "caredesk"
version = "0.1.0"
description = "AI support agent for a healthcare provider: retrieval-grounded resolution, guidance, and escalation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "redis>=5.0",
    "openai>=1.40",
    "langfuse>=2.40",
    "streamlit>=1.37",
    "tiktoken>=0.14.0",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caredesk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["caredesk"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern requires calling Depends()/Query()/etc. in argument
# defaults -- that's how routes declare what to inject. B008 would otherwise
# flag every route parameter that uses it.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Matches the pinned dev interpreter (3.13), not the project's py311 floor:
# numpy (pulled in transitively via streamlit, not imported by caredesk
# itself) ships stubs using 3.12+ syntax, and per-module overrides can't
# suppress a hard parse error in a stub file. caredesk's own code still
# targets 3.11+ per requires-python in [project]; this setting only
# controls how mypy parses third-party stubs it discovers.
python_version = "3.13"
mypy_path = "src"
packages = ["caredesk"]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
