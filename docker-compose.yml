services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: caredesk
      POSTGRES_PASSWORD: caredesk
      POSTGRES_DB: caredesk
    ports:
      - "5432:5432"
    volumes:
      - caredesk_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caredesk -d caredesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caredesk_postgres_data:
