# Slice 2: ambiguous -- 12 cases, expected_decision CLARIFY.
#
# Genuinely under-specified: a correct answer exists, but only after one
# clarifying question (plan tier, clinic site, or which specific service).
# Not merely short queries with one clear answer -- every case here has a
# real branch in the source document that the query doesn't disambiguate.
# `notes` states what the clarifying question should be.

- case_id: amb_001
  slice: ambiguous
  query: "do i need a referral to see a specialist"
  persona: patient
  expected_decision: CLARIFY
  expected_source_docs: ["policy_specialist_referral"]
  notes: "Plan-dependent: standard tier requires a primary care referral (except OB/GYN, first dermatology visit, behavioral health); premium tier requires none. Clarifying question: which plan tier -- standard or premium?"
  difficulty: medium
  tags: ["policy", "referral", "plan_dependent"]

